version: 2
registry: docker.io
namespace: toilachuoituyet
platforms:
  - linux/amd64
  - linux/arm64

owners:
  vn-news-app:
    tag_env: VN_NEWS_APP_IMAGE_TAG
    source_repositories:
      - vn-news-app
      - vn-news-platform-lib
  vn-news-infra:
    tag_env: VN_NEWS_INFRA_IMAGE_TAG
    source_repositories:
      - vn-news-infra
  vn-news-services:
    tag_env: VN_NEWS_SERVICES_IMAGE_TAG
    source_repositories:
      - vn-news-services
      - vn-news-platform-lib

images:
  app_api:
    owner: vn-news-app
    image_repository: vn-news-api

  app_web:
    owner: vn-news-app
    image_repository: vn-news-web

  infra_airflow_runtime:
    owner: vn-news-infra
    image_repository: vn-news-airflow-runtime

  service_feed_ingestor:
    owner: vn-news-services
    image_repository: vn-news-feed-ingestor

  service_article_fetcher:
    owner: vn-news-services
    image_repository: vn-news-article-fetcher

  service_article_extractor:
    owner: vn-news-services
    image_repository: vn-news-article-extractor

  service_pipeline_metrics:
    owner: vn-news-services
    image_repository: vn-news-pipeline-metrics

  service_dlq_operator:
    owner: vn-news-services
    image_repository: vn-news-dlq-operator
