name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      release_manifest:
        description: Release manifest filename under releases/
        required: true
        default: 0.2.8.toml
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      image_tag: ${{ steps.release.outputs.image_tag }}
      vn_news_app_ref: ${{ steps.release.outputs.vn_news_app_ref }}
      vn_news_cicd_ref: ${{ steps.release.outputs.vn_news_cicd_ref }}
      vn_news_config_ref: ${{ steps.release.outputs.vn_news_config_ref }}
      vn_news_infra_ref: ${{ steps.release.outputs.vn_news_infra_ref }}
      vn_news_orchestration_ref: ${{ steps.release.outputs.vn_news_orchestration_ref }}
      vn_news_platform_lib_ref: ${{ steps.release.outputs.vn_news_platform_lib_ref }}
    steps:
      - name: Check out CI/CD
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Read release manifest
        id: release
        env:
          RELEASE_MANIFEST: ${{ inputs.release_manifest }}
        run: python -m scripts.release_manifest --manifest "$RELEASE_MANIFEST" --github-output "$GITHUB_OUTPUT"

      - name: Validate release refs
        env:
          GITHUB_TOKEN: ${{ secrets.WORKSPACE_READ_TOKEN }}
          RELEASE_MANIFEST: ${{ inputs.release_manifest }}
        run: python -m scripts.validate_release_refs --manifest "$RELEASE_MANIFEST"

      - name: Check out pinned CI/CD
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ steps.release.outputs.vn_news_cicd_ref }}

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.17"
          python-version: "3.12"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - name: Verify published images
        env:
          IMAGE_TAG: ${{ steps.release.outputs.image_tag }}
        run: uv run --no-project --with PyYAML python -m scripts.verify_images --tag "$IMAGE_TAG"

  deploy-data:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Check out CI/CD
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ needs.release.outputs.vn_news_cicd_ref }}

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ vars.ORACLE_SSH_KNOWN_HOSTS || secrets.ORACLE_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Preflight data node
        env:
          HOST: ${{ vars.ORACLE_DATA_HOST || secrets.ORACLE_DATA_HOST }}
          USER: ${{ vars.ORACLE_SSH_USER || secrets.ORACLE_SSH_USER }}
        run: ssh "$USER@$HOST" bash -s -- data < scripts/preflight_host.sh

      - name: Deploy data node
        env:
          HOST: ${{ vars.ORACLE_DATA_HOST || secrets.ORACLE_DATA_HOST }}
          USER: ${{ vars.ORACLE_SSH_USER || secrets.ORACLE_SSH_USER }}
          RELEASE_TAG: ${{ needs.release.outputs.image_tag }}
          INFRA_REF: ${{ needs.release.outputs.vn_news_infra_ref }}
          CICD_REF: ${{ needs.release.outputs.vn_news_cicd_ref }}
        run: |
          ssh "$USER@$HOST" bash -s -- \
            data "$RELEASE_TAG" "$INFRA_REF" "$CICD_REF" \
            < scripts/deploy_production.sh

  deploy-control:
    needs: [release, deploy-data]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Check out CI/CD
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ needs.release.outputs.vn_news_cicd_ref }}

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ vars.ORACLE_SSH_KNOWN_HOSTS || secrets.ORACLE_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Preflight control node
        env:
          HOST: ${{ vars.ORACLE_CONTROL_HOST || secrets.ORACLE_CONTROL_HOST }}
          USER: ${{ vars.ORACLE_SSH_USER || secrets.ORACLE_SSH_USER }}
        run: ssh "$USER@$HOST" bash -s -- control < scripts/preflight_host.sh

      - name: Deploy control node
        env:
          HOST: ${{ vars.ORACLE_CONTROL_HOST || secrets.ORACLE_CONTROL_HOST }}
          USER: ${{ vars.ORACLE_SSH_USER || secrets.ORACLE_SSH_USER }}
          RELEASE_TAG: ${{ needs.release.outputs.image_tag }}
          INFRA_REF: ${{ needs.release.outputs.vn_news_infra_ref }}
          CONFIG_REF: ${{ needs.release.outputs.vn_news_config_ref }}
          CICD_REF: ${{ needs.release.outputs.vn_news_cicd_ref }}
          ORCHESTRATION_REF: ${{ needs.release.outputs.vn_news_orchestration_ref }}
          APP_REF: ${{ needs.release.outputs.vn_news_app_ref }}
          PLATFORM_LIB_REF: ${{ needs.release.outputs.vn_news_platform_lib_ref }}
        run: |
          ssh "$USER@$HOST" bash -s -- \
            control "$RELEASE_TAG" "$INFRA_REF" "$CONFIG_REF" "$CICD_REF" "$ORCHESTRATION_REF" "$APP_REF" "$PLATFORM_LIB_REF" \
            < scripts/deploy_production.sh

  deploy-processing:
    needs: [release, deploy-data]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Check out CI/CD
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ needs.release.outputs.vn_news_cicd_ref }}

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ vars.ORACLE_SSH_KNOWN_HOSTS || secrets.ORACLE_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Preflight processing node
        env:
          HOST: ${{ vars.ORACLE_PROCESSING_HOST || secrets.ORACLE_PROCESSING_HOST }}
          USER: ${{ vars.ORACLE_SSH_USER || secrets.ORACLE_SSH_USER }}
        run: ssh "$USER@$HOST" bash -s -- processing < scripts/preflight_host.sh

      - name: Deploy processing node
        env:
          HOST: ${{ vars.ORACLE_PROCESSING_HOST || secrets.ORACLE_PROCESSING_HOST }}
          USER: ${{ vars.ORACLE_SSH_USER || secrets.ORACLE_SSH_USER }}
          RELEASE_TAG: ${{ needs.release.outputs.image_tag }}
          INFRA_REF: ${{ needs.release.outputs.vn_news_infra_ref }}
          CONFIG_REF: ${{ needs.release.outputs.vn_news_config_ref }}
          CICD_REF: ${{ needs.release.outputs.vn_news_cicd_ref }}
        run: |
          ssh "$USER@$HOST" bash -s -- \
            processing "$RELEASE_TAG" "$INFRA_REF" "$CONFIG_REF" "$CICD_REF" \
            < scripts/deploy_production.sh
