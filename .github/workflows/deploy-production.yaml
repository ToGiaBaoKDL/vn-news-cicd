name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      release_manifest:
        description: Release manifest filename under releases/
        required: true
        default: 0.2.5-infra-cleanup.toml
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy-data:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Check out CI/CD
        uses: actions/checkout@v6

      - name: Read release manifest
        id: release
        env:
          RELEASE_MANIFEST: ${{ inputs.release_manifest }}
        run: python -m scripts.release_manifest --manifest "$RELEASE_MANIFEST" --github-output "$GITHUB_OUTPUT"

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ vars.ORACLE_SSH_KNOWN_HOSTS || secrets.ORACLE_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Deploy data node
        env:
          HOST: ${{ vars.ORACLE_DATA_HOST || secrets.ORACLE_DATA_HOST }}
          USER: ${{ vars.ORACLE_SSH_USER || secrets.ORACLE_SSH_USER }}
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
          INFRA_REF: ${{ steps.release.outputs.vn_news_infra_ref }}
        run: |
          ssh "$USER@$HOST" bash -s -- \
            data "$RELEASE_TAG" "$INFRA_REF" "$GITHUB_SHA" \
            < scripts/deploy_production.sh

  deploy-control:
    needs: deploy-data
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Check out CI/CD
        uses: actions/checkout@v6

      - name: Read release manifest
        id: release
        env:
          RELEASE_MANIFEST: ${{ inputs.release_manifest }}
        run: python -m scripts.release_manifest --manifest "$RELEASE_MANIFEST" --github-output "$GITHUB_OUTPUT"

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ vars.ORACLE_SSH_KNOWN_HOSTS || secrets.ORACLE_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Deploy control node
        env:
          HOST: ${{ vars.ORACLE_CONTROL_HOST || secrets.ORACLE_CONTROL_HOST }}
          USER: ${{ vars.ORACLE_SSH_USER || secrets.ORACLE_SSH_USER }}
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
          INFRA_REF: ${{ steps.release.outputs.vn_news_infra_ref }}
          CONFIG_REF: ${{ steps.release.outputs.vn_news_config_ref }}
          CICD_REF: ${{ github.sha }}
          ORCHESTRATION_REF: ${{ steps.release.outputs.vn_news_orchestration_ref }}
          PLATFORM_LIB_REF: ${{ steps.release.outputs.vn_news_platform_lib_ref }}
          APP_REF: ${{ steps.release.outputs.vn_news_app_ref }}
        run: |
          ssh "$USER@$HOST" bash -s -- \
            control "$RELEASE_TAG" "$INFRA_REF" "$CONFIG_REF" "$CICD_REF" "$ORCHESTRATION_REF" "$PLATFORM_LIB_REF" "$APP_REF" \
            < scripts/deploy_production.sh

  deploy-processing:
    needs: deploy-control
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Check out CI/CD
        uses: actions/checkout@v6

      - name: Read release manifest
        id: release
        env:
          RELEASE_MANIFEST: ${{ inputs.release_manifest }}
        run: python -m scripts.release_manifest --manifest "$RELEASE_MANIFEST" --github-output "$GITHUB_OUTPUT"

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ vars.ORACLE_SSH_KNOWN_HOSTS || secrets.ORACLE_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Deploy processing node
        env:
          HOST: ${{ vars.ORACLE_PROCESSING_HOST || secrets.ORACLE_PROCESSING_HOST }}
          USER: ${{ vars.ORACLE_SSH_USER || secrets.ORACLE_SSH_USER }}
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
          INFRA_REF: ${{ steps.release.outputs.vn_news_infra_ref }}
          CONFIG_REF: ${{ steps.release.outputs.vn_news_config_ref }}
        run: |
          ssh "$USER@$HOST" bash -s -- \
            processing "$RELEASE_TAG" "$INFRA_REF" "$CONFIG_REF" "$GITHUB_SHA" \
            < scripts/deploy_production.sh
