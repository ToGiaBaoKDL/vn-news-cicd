name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      image_manifest:
        description: Optional complete digest-pinned image refs JSON. Use for recovery/manual deploy only.
        required: false
        default: ""
        type: string
      base_image_manifest:
        description: Optional complete base digest manifest JSON used before applying artifact updates.
        required: false
        default: ""
        type: string
      base_deploy_run_id:
        description: Optional prior Deploy Production run ID with production-image-manifest artifact.
        required: false
        default: ""
        type: string
      app_manifest_run_id:
        description: Optional vn-news-app Publish Images run ID with image-manifest artifact.
        required: false
        default: ""
        type: string
      infra_manifest_run_id:
        description: Optional vn-news-infra Publish Images run ID with image-manifest artifact.
        required: false
        default: ""
        type: string
      services_manifest_run_id:
        description: Optional vn-news-services Publish Images run ID with image-manifest artifact.
        required: false
        default: ""
        type: string
      default_ref:
        description: Default ref for all repositories.
        required: true
        default: main
        type: string
      repo_refs:
        description: Optional repo=ref overrides, comma or newline separated.
        required: false
        default: ""
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      image_manifest: ${{ steps.refs.outputs.image_manifest }}
      vn_news_app_ref: ${{ steps.refs.outputs.vn_news_app_ref }}
      vn_news_cicd_ref: ${{ steps.refs.outputs.vn_news_cicd_ref }}
      vn_news_config_ref: ${{ steps.refs.outputs.vn_news_config_ref }}
      vn_news_infra_ref: ${{ steps.refs.outputs.vn_news_infra_ref }}
      vn_news_orchestration_ref: ${{ steps.refs.outputs.vn_news_orchestration_ref }}
      vn_news_pipelines_ref: ${{ steps.refs.outputs.vn_news_pipelines_ref }}
      vn_news_platform_lib_ref: ${{ steps.refs.outputs.vn_news_platform_lib_ref }}
      vn_news_services_ref: ${{ steps.refs.outputs.vn_news_services_ref }}
    steps:
      - name: Check out CI/CD
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.17"
          python-version: "3.12"

      - name: Resolve image manifest artifact runs
        id: artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.WORKSPACE_READ_TOKEN || github.token }}
          APP_MANIFEST_RUN_ID: ${{ inputs.app_manifest_run_id }}
          BASE_DEPLOY_RUN_ID: ${{ inputs.base_deploy_run_id }}
          BASE_IMAGE_MANIFEST: ${{ inputs.base_image_manifest }}
          IMAGE_MANIFEST: ${{ inputs.image_manifest }}
          INFRA_MANIFEST_RUN_ID: ${{ inputs.infra_manifest_run_id }}
          SERVICES_MANIFEST_RUN_ID: ${{ inputs.services_manifest_run_id }}
        run: |
          uv run --no-project --python 3.12 python -m scripts.images.artifacts \
            --manual-manifest "$IMAGE_MANIFEST" \
            --base-manifest "$BASE_IMAGE_MANIFEST" \
            --base-run-id "$BASE_DEPLOY_RUN_ID" \
            --app-run-id "$APP_MANIFEST_RUN_ID" \
            --infra-run-id "$INFRA_MANIFEST_RUN_ID" \
            --services-run-id "$SERVICES_MANIFEST_RUN_ID" \
            --github-output "$GITHUB_OUTPUT"

      - name: Download base deployment manifest
        if: ${{ inputs.base_deploy_run_id != '' }}
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: production-image-manifest
          path: image-manifests/base
          github-token: ${{ secrets.WORKSPACE_READ_TOKEN || github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.base_deploy_run_id }}

      - name: Download app image manifest
        if: ${{ steps.artifacts.outputs.app_manifest_run_id != '' }}
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: image-manifest
          path: image-manifests/updates/vn-news-app
          github-token: ${{ secrets.WORKSPACE_READ_TOKEN || github.token }}
          repository: ${{ github.repository_owner }}/vn-news-app
          run-id: ${{ steps.artifacts.outputs.app_manifest_run_id }}

      - name: Download infra image manifest
        if: ${{ steps.artifacts.outputs.infra_manifest_run_id != '' }}
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: image-manifest
          path: image-manifests/updates/vn-news-infra
          github-token: ${{ secrets.WORKSPACE_READ_TOKEN || github.token }}
          repository: ${{ github.repository_owner }}/vn-news-infra
          run-id: ${{ steps.artifacts.outputs.infra_manifest_run_id }}

      - name: Download services image manifest
        if: ${{ steps.artifacts.outputs.services_manifest_run_id != '' }}
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: image-manifest
          path: image-manifests/updates/vn-news-services
          github-token: ${{ secrets.WORKSPACE_READ_TOKEN || github.token }}
          repository: ${{ github.repository_owner }}/vn-news-services
          run-id: ${{ steps.artifacts.outputs.services_manifest_run_id }}

      - name: Promote image manifest
        id: manifest
        env:
          BASE_IMAGE_MANIFEST: ${{ inputs.base_image_manifest }}
          IMAGE_MANIFEST: ${{ inputs.image_manifest }}
        run: |
          uv run --no-project --python 3.12 python -m scripts.images.promote \
            --manual "$IMAGE_MANIFEST" \
            --base "$BASE_IMAGE_MANIFEST" \
            --base-file image-manifests/base/image-manifest.json \
            --manifest-dir image-manifests/updates \
            --output image-manifest.json \
            --github-output "$GITHUB_OUTPUT"

      - name: Resolve deployment refs
        id: refs
        env:
          GITHUB_TOKEN: ${{ secrets.WORKSPACE_READ_TOKEN || github.token }}
          DEFAULT_REF: ${{ inputs.default_ref }}
          IMAGE_MANIFEST: ${{ steps.manifest.outputs.image_manifest }}
          REPO_REFS: ${{ inputs.repo_refs }}
        run: |
          uv run --no-project --python 3.12 python -m scripts.deploy.refs \
            --default-ref "$DEFAULT_REF" \
            --refs "$REPO_REFS" \
            --image-manifest "$IMAGE_MANIFEST" \
            --github-output "$GITHUB_OUTPUT"

  verify-images:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Check out CI/CD
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ needs.plan.outputs.vn_news_cicd_ref }}
          path: vn-news-cicd

      - name: Check out app
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: ${{ github.repository_owner }}/vn-news-app
          token: ${{ secrets.WORKSPACE_READ_TOKEN || github.token }}
          ref: ${{ needs.plan.outputs.vn_news_app_ref }}
          path: vn-news-app

      - name: Check out config
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: ${{ github.repository_owner }}/vn-news-config
          token: ${{ secrets.WORKSPACE_READ_TOKEN || github.token }}
          ref: ${{ needs.plan.outputs.vn_news_config_ref }}
          path: vn-news-config

      - name: Check out infra
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: ${{ github.repository_owner }}/vn-news-infra
          token: ${{ secrets.WORKSPACE_READ_TOKEN || github.token }}
          ref: ${{ needs.plan.outputs.vn_news_infra_ref }}
          path: vn-news-infra

      - name: Check out orchestration
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: ${{ github.repository_owner }}/vn-news-orchestration
          token: ${{ secrets.WORKSPACE_READ_TOKEN || github.token }}
          ref: ${{ needs.plan.outputs.vn_news_orchestration_ref }}
          path: vn-news-orchestration

      - name: Check out platform library
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: ${{ github.repository_owner }}/vn-news-platform-lib
          token: ${{ secrets.WORKSPACE_READ_TOKEN || github.token }}
          ref: ${{ needs.plan.outputs.vn_news_platform_lib_ref }}
          path: vn-news-platform-lib

      - name: Check out pipelines
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: ${{ github.repository_owner }}/vn-news-pipelines
          token: ${{ secrets.WORKSPACE_READ_TOKEN || github.token }}
          ref: ${{ needs.plan.outputs.vn_news_pipelines_ref }}
          path: vn-news-pipelines

      - name: Check out services
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: ${{ github.repository_owner }}/vn-news-services
          token: ${{ secrets.WORKSPACE_READ_TOKEN || github.token }}
          ref: ${{ needs.plan.outputs.vn_news_services_ref }}
          path: vn-news-services

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.17"
          python-version: "3.12"
          working-directory: vn-news-cicd

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - name: Validate assembled workspace
        working-directory: vn-news-cicd
        env:
          VN_NEWS_CONFIG_DIR: ../vn-news-config/configs
        run: |
          uv sync --frozen --all-groups
          uv lock --check
          uv run python -m pytest
          uv run python -m scripts.workspace.verify

      - name: Log in to Docker Hub
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Verify deployment images
        working-directory: vn-news-cicd
        env:
          IMAGE_MANIFEST: ${{ needs.plan.outputs.image_manifest }}
        run: uv run python -m scripts.images.verify --manifest "$IMAGE_MANIFEST"

  deploy-data:
    needs: [plan, verify-images]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Check out CI/CD
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ needs.plan.outputs.vn_news_cicd_ref }}

      - name: Configure SSH
        uses: ./.github/actions/configure-ssh
        with:
          private-key: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
          known-hosts: ${{ vars.ORACLE_SSH_KNOWN_HOSTS || secrets.ORACLE_SSH_KNOWN_HOSTS }}

      - name: Preflight data node
        env:
          HOST: ${{ vars.ORACLE_DATA_HOST || secrets.ORACLE_DATA_HOST }}
          USER: ${{ vars.ORACLE_SSH_USER || secrets.ORACLE_SSH_USER }}
        run: ssh "$USER@$HOST" bash -s -- data < scripts/deploy/preflight_host.sh

      - name: Deploy data node
        env:
          HOST: ${{ vars.ORACLE_DATA_HOST || secrets.ORACLE_DATA_HOST }}
          USER: ${{ vars.ORACLE_SSH_USER || secrets.ORACLE_SSH_USER }}
          IMAGE_MANIFEST: ${{ needs.plan.outputs.image_manifest }}
          INFRA_REF: ${{ needs.plan.outputs.vn_news_infra_ref }}
          CONFIG_REF: ${{ needs.plan.outputs.vn_news_config_ref }}
          CICD_REF: ${{ needs.plan.outputs.vn_news_cicd_ref }}
          PLATFORM_LIB_REF: ${{ needs.plan.outputs.vn_news_platform_lib_ref }}
        run: |
          image_manifest_arg="$(printf '%q' "$IMAGE_MANIFEST")"
          ssh "$USER@$HOST" bash -s -- \
            --role data \
            --image-manifest "$image_manifest_arg" \
            --infra-ref "$INFRA_REF" \
            --config-ref "$CONFIG_REF" \
            --cicd-ref "$CICD_REF" \
            --platform-lib-ref "$PLATFORM_LIB_REF" \
            < scripts/deploy/production.sh

  deploy-control:
    needs: [plan, verify-images, deploy-data]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Check out CI/CD
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ needs.plan.outputs.vn_news_cicd_ref }}

      - name: Configure SSH
        uses: ./.github/actions/configure-ssh
        with:
          private-key: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
          known-hosts: ${{ vars.ORACLE_SSH_KNOWN_HOSTS || secrets.ORACLE_SSH_KNOWN_HOSTS }}

      - name: Preflight control node
        env:
          HOST: ${{ vars.ORACLE_CONTROL_HOST || secrets.ORACLE_CONTROL_HOST }}
          USER: ${{ vars.ORACLE_SSH_USER || secrets.ORACLE_SSH_USER }}
        run: ssh "$USER@$HOST" bash -s -- control < scripts/deploy/preflight_host.sh

      - name: Deploy control node
        env:
          HOST: ${{ vars.ORACLE_CONTROL_HOST || secrets.ORACLE_CONTROL_HOST }}
          USER: ${{ vars.ORACLE_SSH_USER || secrets.ORACLE_SSH_USER }}
          IMAGE_MANIFEST: ${{ needs.plan.outputs.image_manifest }}
          INFRA_REF: ${{ needs.plan.outputs.vn_news_infra_ref }}
          CONFIG_REF: ${{ needs.plan.outputs.vn_news_config_ref }}
          CICD_REF: ${{ needs.plan.outputs.vn_news_cicd_ref }}
          PLATFORM_LIB_REF: ${{ needs.plan.outputs.vn_news_platform_lib_ref }}
          ORCHESTRATION_REF: ${{ needs.plan.outputs.vn_news_orchestration_ref }}
          APP_REF: ${{ needs.plan.outputs.vn_news_app_ref }}
          PIPELINES_REF: ${{ needs.plan.outputs.vn_news_pipelines_ref }}
        run: |
          image_manifest_arg="$(printf '%q' "$IMAGE_MANIFEST")"
          ssh "$USER@$HOST" bash -s -- \
            --role control \
            --image-manifest "$image_manifest_arg" \
            --infra-ref "$INFRA_REF" \
            --config-ref "$CONFIG_REF" \
            --cicd-ref "$CICD_REF" \
            --platform-lib-ref "$PLATFORM_LIB_REF" \
            --orchestration-ref "$ORCHESTRATION_REF" \
            --app-ref "$APP_REF" \
            --pipelines-ref "$PIPELINES_REF" \
            < scripts/deploy/production.sh

  deploy-processing:
    needs: [plan, verify-images, deploy-data, deploy-control]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Check out CI/CD
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ needs.plan.outputs.vn_news_cicd_ref }}

      - name: Configure SSH
        uses: ./.github/actions/configure-ssh
        with:
          private-key: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
          known-hosts: ${{ vars.ORACLE_SSH_KNOWN_HOSTS || secrets.ORACLE_SSH_KNOWN_HOSTS }}

      - name: Preflight processing node
        env:
          HOST: ${{ vars.ORACLE_PROCESSING_HOST || secrets.ORACLE_PROCESSING_HOST }}
          USER: ${{ vars.ORACLE_SSH_USER || secrets.ORACLE_SSH_USER }}
        run: ssh "$USER@$HOST" bash -s -- processing < scripts/deploy/preflight_host.sh

      - name: Deploy processing node
        env:
          HOST: ${{ vars.ORACLE_PROCESSING_HOST || secrets.ORACLE_PROCESSING_HOST }}
          USER: ${{ vars.ORACLE_SSH_USER || secrets.ORACLE_SSH_USER }}
          IMAGE_MANIFEST: ${{ needs.plan.outputs.image_manifest }}
          INFRA_REF: ${{ needs.plan.outputs.vn_news_infra_ref }}
          CONFIG_REF: ${{ needs.plan.outputs.vn_news_config_ref }}
          CICD_REF: ${{ needs.plan.outputs.vn_news_cicd_ref }}
          PLATFORM_LIB_REF: ${{ needs.plan.outputs.vn_news_platform_lib_ref }}
        run: |
          image_manifest_arg="$(printf '%q' "$IMAGE_MANIFEST")"
          ssh "$USER@$HOST" bash -s -- \
            --role processing \
            --image-manifest "$image_manifest_arg" \
            --infra-ref "$INFRA_REF" \
            --config-ref "$CONFIG_REF" \
            --cicd-ref "$CICD_REF" \
            --platform-lib-ref "$PLATFORM_LIB_REF" \
            < scripts/deploy/production.sh

  archive-deployment:
    needs: [plan, deploy-processing]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Write production image manifest
        env:
          IMAGE_MANIFEST: ${{ needs.plan.outputs.image_manifest }}
        run: printf '%s\n' "$IMAGE_MANIFEST" > image-manifest.json

      - name: Upload production image manifest
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: production-image-manifest
          path: image-manifest.json
          if-no-files-found: error
          retention-days: 90
