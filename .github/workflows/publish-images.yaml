name: Publish Images

on:
  workflow_dispatch:
    inputs:
      release_manifest:
        description: Release manifest filename under releases/
        required: true
        default: 0.2.7.toml
        type: string

permissions:
  contents: read

concurrency:
  group: publish-images-${{ inputs.release_manifest }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    steps:
      - name: Check out CI/CD
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          path: vn-news-cicd

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.17"
          python-version: "3.12"
          working-directory: vn-news-cicd

      - name: Read release manifest
        id: release
        working-directory: vn-news-cicd
        env:
          RELEASE_MANIFEST: ${{ inputs.release_manifest }}
        run: uv run --no-project --python 3.12 python -m scripts.release_manifest --manifest "$RELEASE_MANIFEST" --github-output "$GITHUB_OUTPUT"

      - name: Validate release refs
        working-directory: vn-news-cicd
        env:
          GITHUB_TOKEN: ${{ secrets.WORKSPACE_READ_TOKEN }}
          RELEASE_MANIFEST: ${{ inputs.release_manifest }}
        run: uv run --no-project --python 3.12 python -m scripts.validate_release_refs --manifest "$RELEASE_MANIFEST"

      - name: Check out pinned CI/CD
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ steps.release.outputs.vn_news_cicd_ref }}
          path: vn-news-cicd

      - name: Check out app
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: ${{ github.repository_owner }}/vn-news-app
          token: ${{ secrets.WORKSPACE_READ_TOKEN || github.token }}
          ref: ${{ steps.release.outputs.vn_news_app_ref }}
          path: vn-news-app

      - name: Check out config
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: ${{ github.repository_owner }}/vn-news-config
          token: ${{ secrets.WORKSPACE_READ_TOKEN || github.token }}
          ref: ${{ steps.release.outputs.vn_news_config_ref }}
          path: vn-news-config

      - name: Check out infra
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: ${{ github.repository_owner }}/vn-news-infra
          token: ${{ secrets.WORKSPACE_READ_TOKEN || github.token }}
          ref: ${{ steps.release.outputs.vn_news_infra_ref }}
          path: vn-news-infra

      - name: Check out orchestration
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: ${{ github.repository_owner }}/vn-news-orchestration
          token: ${{ secrets.WORKSPACE_READ_TOKEN || github.token }}
          ref: ${{ steps.release.outputs.vn_news_orchestration_ref }}
          path: vn-news-orchestration

      - name: Check out platform library
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: ${{ github.repository_owner }}/vn-news-platform-lib
          token: ${{ secrets.WORKSPACE_READ_TOKEN || github.token }}
          ref: ${{ steps.release.outputs.vn_news_platform_lib_ref }}
          path: vn-news-platform-lib

      - name: Check out services
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: ${{ github.repository_owner }}/vn-news-services
          token: ${{ secrets.WORKSPACE_READ_TOKEN || github.token }}
          ref: ${{ steps.release.outputs.vn_news_services_ref }}
          path: vn-news-services

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - name: Validate assembled workspace
        working-directory: vn-news-cicd
        env:
          VN_NEWS_CONFIG_DIR: ../vn-news-config/configs
        run: |
          uv sync --frozen --all-groups
          uv lock --check
          uv run python -m pytest
          uv run python -m scripts.validate_workspace

      - name: Log in to Docker Hub
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push images
        working-directory: vn-news-cicd
        env:
          IMAGE_TAG: ${{ steps.release.outputs.image_tag }}
        run: uv run python -m scripts.build_images --tag "$IMAGE_TAG" --push --github-actions-cache

      - name: Verify published images
        working-directory: vn-news-cicd
        env:
          IMAGE_TAG: ${{ steps.release.outputs.image_tag }}
        run: uv run python -m scripts.verify_images --tag "$IMAGE_TAG"
